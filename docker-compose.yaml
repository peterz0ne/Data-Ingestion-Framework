services:

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-master
    hostname: spark-master

    command: >
      /opt/spark/sbin/start-master.sh

    ports:
      - "8080:8080"
      - "7077:7077"

    environment:
      SPARK_NO_DAEMONIZE: "true"

    networks:
      - spark-network

    restart: unless-stopped

    volumes:
      - ./jobs:/opt/spark/jobs
      - ./configs:/opt/spark/configs
      - ./landing:/opt/spark/landing

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G


  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-worker-1
    hostname: spark-worker-1

    command: >
      /opt/spark/sbin/start-worker.sh
      spark://spark-master:7077
      --cores 4
      --memory 4G

    depends_on:
      - spark-master

    ports:
      - "8081:8081"

    environment:
      SPARK_NO_DAEMONIZE: "true"

    networks:
      - spark-network

    restart: unless-stopped

    volumes:
      - ./jobs:/opt/spark/jobs
      - ./configs:/opt/spark/configs
      - ./landing:/opt/spark/landing

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G


  spark-worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-worker-2
    hostname: spark-worker-2

    command: >
      /opt/spark/sbin/start-worker.sh
      spark://spark-master:7077
      --cores 4
      --memory 4G

    depends_on:
      - spark-master

    ports:
      - "8082:8081"

    environment:
      SPARK_NO_DAEMONIZE: "true"

    networks:
      - spark-network

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
    volumes:
      - ./jobs:/opt/spark/jobs
      - ./configs:/opt/spark/configs
      - ./landing:/opt/spark/landing


  # --------------------------------------------------
  # MINIO
  # --------------------------------------------------

  minio:
    image: openvidu/minio:RELEASE.2026-07-17T12-07-51Z
    container_name: minio
    hostname: minio

    command:
      - server
      - /bitnami/minio/data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio-data:/bitnami/minio/data

    networks:
      - spark-network

    restart: unless-stopped


  # --------------------------------------------------
  # JUPYTER
  # --------------------------------------------------

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: jupyter
    hostname: jupyter

    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --ServerApp.token=''
      --ServerApp.password=''
      --ServerApp.disable_check_xsrf=True

    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
      - minio

    ports:
      - "8888:8888"

    environment:
      HOME: /home/spark
      JUPYTER_RUNTIME_DIR: /home/spark/.local/share/jupyter/runtime

      SPARK_MASTER: spark://spark-master:7077
      SPARK_LOCAL_IP: jupyter
      SPARK_DRIVER_HOST: jupyter
      SPARK_DRIVER_PORT: "4041"

      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3

    networks:
      - spark-network

    volumes:
      - ./jobs:/opt/spark/jobs
      - ./configs:/opt/spark/configs
      - ./landing:/opt/spark/landing
      - ./notebooks:/opt/spark/notebooks

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G


  # --------------------------------------------------
  # MINIO INITIALIZATION
  # --------------------------------------------------

  minio-init:
    image: openvidu/minio:RELEASE.2026-07-17T12-07-51Z
    container_name: minio-init

    depends_on:
      - minio

    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minio minio123456; do
          echo "Waiting for MinIO..."
          sleep 2
        done

        mc mb --ignore-existing local/delta-data

        echo "MinIO bucket ready"

    networks:
      - spark-network


networks:
  spark-network:
    driver: bridge


volumes:
  minio-data:
