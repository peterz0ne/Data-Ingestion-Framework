services:

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-master
    hostname: spark-master

    command: >
      /opt/spark/sbin/start-master.sh

    ports:
      - "8080:8080"
      - "7077:7077"

    environment:
      SPARK_NO_DAEMONIZE: "true"

    networks:
      - spark-network

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G


  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-worker-1
    hostname: spark-worker-1

    command: >
      /opt/spark/sbin/start-worker.sh
      spark://spark-master:7077
      --cores 4
      --memory 4G

    depends_on:
      - spark-master

    ports:
      - "8081:8081"

    environment:
      SPARK_NO_DAEMONIZE: "true"

    networks:
      - spark-network

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G


  spark-worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-worker-2
    hostname: spark-worker-2

    command: >
      /opt/spark/sbin/start-worker.sh
      spark://spark-master:7077
      --cores 4
      --memory 4G

    depends_on:
      - spark-master

    ports:
      - "8082:8081"

    environment:
      SPARK_NO_DAEMONIZE: "true"

    networks:
      - spark-network

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G


  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio

    command: >
      server /data
      --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio-data:/data

    networks:
      - spark-network

    restart: unless-stopped


  minio-init:
    image: minio/mc:latest
    container_name: minio-init

    depends_on:
      - minio

    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio123456; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing local/delta-data;
      mc anonymous set private local/delta-data;
      echo 'MinIO bucket ready';
      "

    networks:
      - spark-network


networks:
  spark-network:
    driver: bridge


volumes:
  minio-data:
